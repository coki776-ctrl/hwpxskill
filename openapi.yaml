openapi: 3.1.0
info:
  title: HWPX Skill API
  version: 0.2.0
  description: Inspect, validate, and edit HWPX documents through GPT Actions while preserving their original structure.

servers:
  - url: https://hwpxskill-api.onrender.com

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the HWPX API is running.
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /action/inspect:
    post:
      operationId: inspectHwpx
      summary: Inspect one HWPX file uploaded in the current ChatGPT conversation.
      description: Use the HWPX file attached by the user. Send exactly one conversation file in openaiFileIdRefs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation.
                include_empty_cells:
                  type: boolean
                  default: true
                preview_len:
                  type: integer
                  default: 80
                  minimum: 10
                  maximum: 300
      responses:
        "200":
          description: Editable paragraph and table-cell slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectResponse"

  /action/validate:
    post:
      operationId: validateHwpx
      summary: Validate one HWPX file uploaded in the current ChatGPT conversation.
      description: Use the HWPX file attached by the user. Send exactly one conversation file in openaiFileIdRefs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation.
      responses:
        "200":
          description: HWPX validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"

  /action/edit:
    post:
      operationId: editHwpx
      summary: Edit one HWPX file uploaded in the current ChatGPT conversation and return the edited HWPX.
      description: First inspect the attached HWPX, then use slot keys or exact text replacements to make the requested edits. Send exactly one conversation file in openaiFileIdRefs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation.
                replacements:
                  type: object
                  additionalProperties:
                    type: string
                  description: Exact old-text to new-text replacements.
                  default: {}
                slots:
                  type: object
                  additionalProperties:
                    type: string
                  description: Slot-key to new-text mapping, such as p:12 or cell:0:2:1.
                  default: {}
                paragraphs:
                  type: object
                  additionalProperties:
                    type: string
                  description: Paragraph-index to new-text mapping.
                  default: {}
                allow_over_budget:
                  type: boolean
                  default: false
                  description: Keep false unless the user explicitly accepts layout overflow risk.
      responses:
        "200":
          description: Edited HWPX returned to the ChatGPT conversation as a downloadable file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditActionResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required: [status, service, version]

    Slot:
      type: object
      properties:
        key:
          type: string
        kind:
          type: string
        index:
          type: integer
        max_chars:
          type: integer
        text_len:
          type: integer
        text_len_nospace:
          type: integer
        preview:
          type: string
      additionalProperties: true

    InspectResponse:
      type: object
      properties:
        source:
          type: string
        version:
          type: integer
        usage:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
      required: [slots]
      additionalProperties: true

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        layout_warning_count:
          type: integer
        layout_warnings:
          type: array
          items:
            type: string
      required: [valid, errors, layout_warning_count, layout_warnings]

    ReturnedFile:
      type: object
      properties:
        name:
          type: string
        mime_type:
          type: string
        content:
          type: string
          format: byte
      required: [name, mime_type, content]

    EditActionResponse:
      type: object
      properties:
        ok:
          type: boolean
        validated:
          type: boolean
        layout_warning_count:
          type: integer
        openaiFileResponse:
          type: array
          items:
            $ref: "#/components/schemas/ReturnedFile"
      required: [ok, validated, layout_warning_count, openaiFileResponse]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
