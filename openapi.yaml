openapi: 3.1.0
info:
  title: HWPX Skill API
  version: 0.2.1
  description: Inspect, validate, and edit HWPX documents through GPT Actions while preserving their original structure.

servers:
  - url: https://hwpxskill-api.onrender.com

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the HWPX API is running.
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /action/inspect-page:
    post:
      operationId: inspectHwpx
      summary: Inspect one HWPX file uploaded in the current ChatGPT conversation in small pages.
      description: Use the user's HWPX file. Return only a small page of editable slots to avoid oversized Action responses. Use search_text when looking for a specific phrase. If has_more is true, call again with next_offset.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                include_empty_cells:
                  type: boolean
                  default: false
                  description: Include empty table cells only when they are needed for the requested edit.
                preview_len:
                  type: integer
                  default: 60
                  minimum: 10
                  maximum: 120
                offset:
                  type: integer
                  default: 0
                  minimum: 0
                  description: Starting slot offset for pagination.
                limit:
                  type: integer
                  default: 50
                  minimum: 1
                  maximum: 100
                  description: Number of slots to return. Prefer 50 or fewer.
                search_text:
                  type: string
                  description: Optional case-insensitive phrase used to filter slot previews before pagination.
      responses:
        "200":
          description: One compact page of editable paragraph and table-cell slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedInspectResponse"

  /action/validate:
    post:
      operationId: validateHwpx
      summary: Validate one HWPX file uploaded in the current ChatGPT conversation.
      description: Use the HWPX file attached by the user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"

  /action/edit:
    post:
      operationId: editHwpx
      summary: Edit one HWPX file uploaded in the current ChatGPT conversation and return the edited HWPX.
      description: Inspect first when needed, then send only the required replacements, slots, or paragraph edits. Preserve layout and structure unless the user explicitly requests otherwise.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                replacements:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map exact old text to new text. Use only when the replacement is unambiguous.
                slots:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map slot keys such as p:12 or cell:0:2:1 to replacement text.
                paragraphs:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map paragraph indices to replacement text.
                allow_over_budget:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Edit result containing the edited HWPX as an OpenAI file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required: [status, service, version]

    Slot:
      type: object
      properties:
        key:
          type: string
        kind:
          type: string
        max_chars:
          type: integer
        preview:
          type: string
        table:
          type: integer
        row:
          type: integer
        col:
          type: integer
        occurrence:
          type: integer
        empty:
          type: boolean
      required: [key, kind, preview]
      additionalProperties: true

    PagedInspectResponse:
      type: object
      properties:
        source:
          type: string
        total_slots:
          type: integer
        matched_slots:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        returned:
          type: integer
        has_more:
          type: boolean
        next_offset:
          type: [integer, "null"]
        search_text:
          type: [string, "null"]
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
      required: [source, total_slots, matched_slots, offset, limit, returned, has_more, slots]

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        layout_warning_count:
          type: integer
        layout_warnings:
          type: array
          items:
            type: string
      required: [valid, errors, layout_warning_count, layout_warnings]

    OpenAIFile:
      type: object
      properties:
        name:
          type: string
        mime_type:
          type: string
        content:
          type: string
          format: byte
      required: [name, mime_type, content]

    EditResponse:
      type: object
      properties:
        ok:
          type: boolean
        validated:
          type: boolean
        layout_warning_count:
          type: integer
        openaiFileResponse:
          type: array
          items:
            $ref: "#/components/schemas/OpenAIFile"
      required: [ok, validated, layout_warning_count, openaiFileResponse]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
