openapi: 3.1.0
info:
  title: HWPX Skill API
  version: 0.2.5
  description: Inspect, search, validate, edit, and rebuild HWPX documents through GPT Actions.

servers:
  - url: https://hwpxskill-api.onrender.com

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the HWPX API is running.
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /action/inspect-summary:
    post:
      operationId: inspectHwpx
      summary: Inspect an uploaded HWPX and return only a very small structural summary.
      description: Use this first to confirm the HWPX can be read. For rebuilding an attached HWPX, use inspectHwpxPage to read its text in pages.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    $ref: "#/components/schemas/ActionFileRef"
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                include_empty_cells:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Compact document summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectSummaryResponse"

  /action/inspect-page:
    post:
      operationId: inspectHwpxPage
      summary: Read text from an uploaded HWPX in small paged chunks.
      description: Read attached HWPX text for rebuilding. Start at offset 0 and repeat with next_offset until has_more is false, then call createRichHwpx with the reconstructed content.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    $ref: "#/components/schemas/ActionFileRef"
                  description: Exactly one user-uploaded .hwpx file from the current conversation.
                include_empty_cells:
                  type: boolean
                  default: false
                preview_len:
                  type: integer
                  default: 80
                  minimum: 10
                  maximum: 80
                offset:
                  type: integer
                  default: 0
                  minimum: 0
                limit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 10
                search_text:
                  type: [string, "null"]
                  maxLength: 200
                  default: null
      responses:
        "200":
          description: One page of HWPX text slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectPageResponse"

  /action/find:
    post:
      operationId: findHwpxText
      summary: Find a phrase in an uploaded HWPX and return at most ten matching editable slots.
      description: Use this to locate exact slot keys before editing. Search with a distinctive phrase from the user's requested change. If too many results match, retry with a more specific phrase.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs, search_text]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    $ref: "#/components/schemas/ActionFileRef"
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                search_text:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Case-insensitive phrase to find in the HWPX.
                include_empty_cells:
                  type: boolean
                  default: false
                preview_len:
                  type: integer
                  default: 80
                  minimum: 20
                  maximum: 120
                limit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Compact list of matching editable slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindResponse"

  /action/validate:
    post:
      operationId: validateHwpx
      summary: Validate one HWPX file uploaded in the current ChatGPT conversation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    $ref: "#/components/schemas/ActionFileRef"
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"

  /action/edit:
    post:
      operationId: editHwpx
      summary: Make minimal text or value edits to an existing HWPX while preserving its current structure and layout.
      description: Use only for minimal text/value edits while preserving structure. If the user asks for charts, new tables, redesign, title styling, emphasis, reorganization, or a one-page/richer report, use createRichHwpx instead—even when an HWPX is attached.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    $ref: "#/components/schemas/ActionFileRef"
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                slot_edits:
                  type: array
                  items:
                    $ref: "#/components/schemas/SlotEdit"
                  default: []
                  description: Explicit edits using slot keys returned by findHwpxText.
                text_replacements:
                  type: array
                  items:
                    $ref: "#/components/schemas/TextReplacement"
                  default: []
                  description: Explicit exact-text replacements.
                paragraph_edits:
                  type: array
                  items:
                    $ref: "#/components/schemas/ParagraphEdit"
                  default: []
                  description: Explicit edits using zero-based paragraph indexes.
                allow_over_budget:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Edit result containing the edited HWPX as an OpenAI file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"

  /action/create-from-template:
    post:
      operationId: createHwpxFromTemplate
      summary: Create a new HWPX using an uploaded HWPX as the formatting template.
      description: Use this only when the user explicitly wants to preserve and reuse the uploaded HWPX formatting as the template for a new document. If the user instead asks for redesign, richer presentation, new charts, new tables, or visual restructuring, use createRichHwpx.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFromTemplateRequest"
      responses:
        "200":
          description: Created HWPX returned as an OpenAI file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"

  /action/create:
    post:
      operationId: createHwpx
      summary: Create a very simple new HWPX from the server blank template.
      description: Use only for simple title-and-paragraph documents that do not need tables, charts, richer hierarchy, or report redesign. For professional reports or visually structured documents, use createRichHwpx.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHwpxRequest"
      responses:
        "200":
          description: Created HWPX returned as an OpenAI file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"

  /action/create-rich:
    post:
      operationId: createRichHwpx
      summary: Create or rebuild a professionally formatted HWPX with headings, tables, emphasis, and embedded PNG charts.
      description: Use for professional report generation or redesign. With an attached HWPX, read it via inspectHwpxPage first, then rebuild. Include ```chart fences for PNG charts. Example values are allowed only when explicitly authorized.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRichHwpxRequest"
      responses:
        "200":
          description: Rich HWPX returned as an OpenAI file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"

components:
  schemas:
    ActionFileRef:
      type: object
      properties:
        name: {type: string}
        id: {type: [string, "null"]}
        mime_type: {type: [string, "null"]}
        download_link: {type: string, format: uri}
      required: [name, download_link]

    SlotEdit:
      type: object
      properties:
        slot_key:
          type: string
          minLength: 3
          pattern: "^(p:\\d+|cell:\\d+:\\d+:\\d+(?::\\d+)?)$"
        new_text: {type: string}
      required: [slot_key, new_text]
      additionalProperties: false

    TextReplacement:
      type: object
      properties:
        old_text: {type: string, minLength: 1}
        new_text: {type: string}
      required: [old_text, new_text]
      additionalProperties: false

    ParagraphEdit:
      type: object
      properties:
        paragraph_index: {type: integer, minimum: 0}
        new_text: {type: string}
      required: [paragraph_index, new_text]
      additionalProperties: false

    CreateFromTemplateRequest:
      type: object
      properties:
        openaiFileIdRefs:
          type: array
          items:
            $ref: "#/components/schemas/ActionFileRef"
        title: {type: string, minLength: 1}
        paragraphs:
          type: array
          minItems: 1
          items: {type: string}
        output_filename:
          type: string
          minLength: 6
          default: created_from_template.hwpx
      required: [openaiFileIdRefs, title, paragraphs]
      additionalProperties: false

    CreateHwpxRequest:
      type: object
      properties:
        title: {type: string, minLength: 1}
        paragraphs:
          type: array
          minItems: 1
          maxItems: 30
          items: {type: string}
        output_filename:
          type: string
          minLength: 6
          default: created.hwpx
      required: [title, paragraphs]
      additionalProperties: false

    CreateRichHwpxRequest:
      type: object
      description: Markdown for a new or rebuilt rich HWPX. For charts, include a ```chart code fence in markdown; the server converts it to an embedded PNG image.
      properties:
        filename: {type: string, minLength: 6, default: report.hwpx}
        markdown:
          type: string
          minLength: 1
          description: Full Markdown document. May include tables and ```chart code fences for server-rendered PNG charts.
        preset:
          type: string
          enum: [보고서, 기안문, 계획서, 통지, 회의록, 개조식, 보도자료]
          default: 보고서
      required: [markdown]
      additionalProperties: false

    HealthResponse:
      type: object
      properties:
        status: {type: string}
        service: {type: string}
        version: {type: string}
      required: [status, service, version]

    Slot:
      type: object
      properties:
        key: {type: string}
        kind: {type: string}
        max_chars: {type: integer}
        preview: {type: string}
        table: {type: integer}
        row: {type: integer}
        col: {type: integer}
        occurrence: {type: integer}
        empty: {type: boolean}
      required: [key, kind, preview]
      additionalProperties: true

    InspectSummaryResponse:
      type: object
      properties:
        ok: {type: boolean}
        source: {type: string}
        total_slots: {type: integer}
        paragraph_slots: {type: integer}
        cell_slots: {type: integer}
      required: [ok, source, total_slots, paragraph_slots, cell_slots]

    InspectPageResponse:
      type: object
      properties:
        ok: {type: boolean}
        source: {type: string}
        matched_slots: {type: integer}
        offset: {type: integer}
        returned: {type: integer}
        has_more: {type: boolean}
        next_offset: {type: [integer, "null"]}
        slots:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Slot"
      required: [ok, source, matched_slots, offset, returned, has_more, slots]

    FindResponse:
      type: object
      properties:
        ok: {type: boolean}
        source: {type: string}
        search_text: {type: string}
        matched_slots: {type: integer}
        returned: {type: integer}
        truncated: {type: boolean}
        slots:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Slot"
      required: [ok, source, search_text, matched_slots, returned, truncated, slots]

    ValidateResponse:
      type: object
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {type: string}
        layout_warning_count: {type: integer}
        layout_warnings:
          type: array
          items: {type: string}
      required: [valid, errors, layout_warning_count, layout_warnings]

    OpenAIFile:
      type: object
      properties:
        name: {type: string}
        mime_type: {type: string}
        content:
          type: string
          format: byte
      required: [name, mime_type, content]

    EditResponse:
      type: object
      properties:
        ok: {type: boolean}
        validated: {type: boolean}
        layout_warning_count: {type: integer}
        openaiFileResponse:
          type: array
          items:
            $ref: "#/components/schemas/OpenAIFile"
      required: [ok, validated, layout_warning_count, openaiFileResponse]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
