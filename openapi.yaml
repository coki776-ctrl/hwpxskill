openapi: 3.1.0
info:
  title: HWPX Skill API
  version: 0.2.2
  description: Inspect, search, validate, and edit HWPX documents through GPT Actions while preserving their original structure.

servers:
  - url: https://hwpxskill-api.onrender.com

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the HWPX API is running.
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /action/inspect-summary:
    post:
      operationId: inspectHwpx
      summary: Inspect an uploaded HWPX and return only a very small structural summary.
      description: Use this first to confirm the HWPX can be read. It intentionally does not return the full slot list. For locating text to edit, call findHwpxText.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                include_empty_cells:
                  type: boolean
                  default: false
                preview_len:
                  type: integer
                  default: 40
                  minimum: 10
                  maximum: 80
      responses:
        "200":
          description: Compact document summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectSummaryResponse"

  /action/find:
    post:
      operationId: findHwpxText
      summary: Find a phrase in an uploaded HWPX and return at most ten matching editable slots.
      description: Use this to locate exact slot keys before editing. Search with a distinctive phrase from the user's requested change. If too many results match, retry with a more specific phrase.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs, search_text]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                search_text:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Case-insensitive phrase to find in the HWPX.
                include_empty_cells:
                  type: boolean
                  default: false
                preview_len:
                  type: integer
                  default: 80
                  minimum: 20
                  maximum: 120
                limit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Compact list of matching editable slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindResponse"

  /action/validate:
    post:
      operationId: validateHwpx
      summary: Validate one HWPX file uploaded in the current ChatGPT conversation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"

  /action/edit:
    post:
      operationId: editHwpx
      summary: Edit an uploaded HWPX and return the edited HWPX file.
      description: Use findHwpxText first when exact slot keys are needed. Send only the edits requested by the user. Preserve the document structure and layout safeguards.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openaiFileIdRefs]
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: Exactly one user-uploaded .hwpx file from the current conversation. ChatGPT populates this automatically.
                replacements:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map exact old text to new text when the replacement is unambiguous.
                slots:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map slot keys such as p:12 or cell:0:2:1 to replacement text.
                paragraphs:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map paragraph indices to replacement text.
                allow_over_budget:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Edit result containing the edited HWPX as an OpenAI file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status: {type: string}
        service: {type: string}
        version: {type: string}
      required: [status, service, version]

    Slot:
      type: object
      properties:
        key: {type: string}
        kind: {type: string}
        max_chars: {type: integer}
        preview: {type: string}
        table: {type: integer}
        row: {type: integer}
        col: {type: integer}
        occurrence: {type: integer}
        empty: {type: boolean}
      required: [key, kind, preview]
      additionalProperties: true

    InspectSummaryResponse:
      type: object
      properties:
        ok: {type: boolean}
        source: {type: string}
        total_slots: {type: integer}
        paragraph_slots: {type: integer}
        cell_slots: {type: integer}
        sample_slots:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/Slot"
        next_step: {type: string}
      required: [ok, source, total_slots, paragraph_slots, cell_slots, sample_slots]

    FindResponse:
      type: object
      properties:
        ok: {type: boolean}
        source: {type: string}
        search_text: {type: string}
        matched_slots: {type: integer}
        returned: {type: integer}
        truncated: {type: boolean}
        slots:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Slot"
      required: [ok, source, search_text, matched_slots, returned, truncated, slots]

    ValidateResponse:
      type: object
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {type: string}
        layout_warning_count: {type: integer}
        layout_warnings:
          type: array
          items: {type: string}
      required: [valid, errors, layout_warning_count, layout_warnings]

    OpenAIFile:
      type: object
      properties:
        name: {type: string}
        mime_type: {type: string}
        content:
          type: string
          format: byte
      required: [name, mime_type, content]

    EditResponse:
      type: object
      properties:
        ok: {type: boolean}
        validated: {type: boolean}
        layout_warning_count: {type: integer}
        openaiFileResponse:
          type: array
          items:
            $ref: "#/components/schemas/OpenAIFile"
      required: [ok, validated, layout_warning_count, openaiFileResponse]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
