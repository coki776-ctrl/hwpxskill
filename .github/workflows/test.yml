name: tests

on:
  pull_request:
  push:
    branches:
      - agent/hwpx-api

jobs:
  kordoc-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Kordoc
        run: |
          npm install -g kordoc@4.4.0 --omit=optional
          kordoc --version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile migrated entrypoints
        run: python -m py_compile kordoc_engine.py rich_action_kordoc.py rich_action_ext.py rich_charts.py
      - name: Run Kordoc migration tests
        run: pytest -q tests/test_kordoc_engine.py tests/test_rich_charts.py

      - name: Diagnose PNG bytes before and after Kordoc
        run: |
          mkdir -p /tmp/kordoc-image-diag
          python - <<'PY'
          from pathlib import Path
          from rich_charts import preprocess_chart_fences
          import hashlib
          workdir = Path('/tmp/kordoc-image-diag')
          markdown = '''# PNG 진단

          ```chart
          type: column
          title: PNG 바이트 진단
          cat: 2024, 2025
          집행률: 94.79, 95.53
          ```
          '''
          rendered, count = preprocess_chart_fences(markdown, workdir)
          assert count == 1
          png = workdir / 'chart_1.png'
          data = png.read_bytes()
          print('INPUT_PNG_SIZE=', len(data))
          print('INPUT_PNG_SHA256=', hashlib.sha256(data).hexdigest())
          print('INPUT_PNG_SIGNATURE=', data[:8].hex())
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(data) > 1000, f'input PNG unexpectedly tiny: {len(data)}'
          (workdir / 'input.md').write_text(rendered, encoding='utf-8')
          PY
          cd /tmp/kordoc-image-diag
          kordoc generate input.md -o output.hwpx --preset 보고서
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          p = Path('/tmp/kordoc-image-diag/output.hwpx')
          input_data = Path('/tmp/kordoc-image-diag/chart_1.png').read_bytes()
          with zipfile.ZipFile(p) as z:
              image_names = [n for n in z.namelist() if n.lower().endswith('.png')]
              assert image_names, z.namelist()
              embedded = z.read(image_names[0])
              print('EMBEDDED_NAME=', image_names[0])
              print('EMBEDDED_PNG_SIZE=', len(embedded))
              print('EMBEDDED_PNG_SHA256=', hashlib.sha256(embedded).hexdigest())
              print('EMBEDDED_PNG_SIGNATURE=', embedded[:8].hex())
              print('PNG_BYTES_IDENTICAL=', input_data == embedded)
              assert embedded[:8] == b'\x89PNG\r\n\x1a\n'
          PY
