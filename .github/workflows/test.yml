name: tests

on:
  pull_request:
  push:
    branches:
      - agent/hwpx-api

jobs:
  kordoc-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Kordoc
        run: |
          npm install -g kordoc@4.4.0 --omit=optional
          kordoc --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Compile migrated entrypoints
        run: python -m py_compile kordoc_engine.py rich_action_kordoc.py rich_action_ext.py rich_charts.py

      - name: Run Kordoc migration tests
        run: pytest -q tests/test_kordoc_engine.py tests/test_rich_charts.py

      - name: Real Kordoc HWPX smoke test
        run: |
          mkdir -p /tmp/kordoc-smoke
          printf '# 테스트\n\nKordoc 실제 HWPX 생성 확인용 문서입니다.\n' > /tmp/kordoc-smoke/input.md
          kordoc generate /tmp/kordoc-smoke/input.md -o /tmp/kordoc-smoke/output.hwpx --preset 보고서
          test -s /tmp/kordoc-smoke/output.hwpx
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('/tmp/kordoc-smoke/output.hwpx')
          with zipfile.ZipFile(p) as z:
              infos = z.infolist()
              assert infos and infos[0].filename == 'mimetype'
              assert infos[0].compress_type == zipfile.ZIP_STORED
              assert z.read('mimetype') == b'application/hwp+zip'
              section = z.read('Contents/section0.xml')
              ET.fromstring(section)
              decoded = section.decode('utf-8')
              assert '테스트' in decoded
              assert 'Kordoc 실제 HWPX 생성 확인용 문서입니다.' in decoded
          print(f'real Kordoc structure smoke OK: {p.stat().st_size} bytes')
          PY

      - name: Real Kordoc table smoke test
        run: |
          mkdir -p /tmp/kordoc-table
          cat > /tmp/kordoc-table/input.md <<'MD'
          # 표 테스트

          | 학교급 | 학교수 | 집행률 |
          |---|---:|---:|
          | 중학교 | 49 | 94.0% |
          | 고등학교 | 68 | 94.9% |
          | 특수학교 | 4 | 99.6% |
          MD
          kordoc generate /tmp/kordoc-table/input.md -o /tmp/kordoc-table/output.hwpx --preset 보고서
          test -s /tmp/kordoc-table/output.hwpx
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('/tmp/kordoc-table/output.hwpx')
          with zipfile.ZipFile(p) as z:
              section = z.read('Contents/section0.xml')
              ET.fromstring(section)
              decoded = section.decode('utf-8')
              for expected in ('표 테스트', '중학교', '고등학교', '특수학교', '49', '68', '99.6%'):
                  assert expected in decoded, expected
          print(f'table smoke OK: {p.stat().st_size} bytes')
          PY

      - name: Real PNG chart embed smoke test
        run: |
          mkdir -p /tmp/kordoc-chart
          python - <<'PY'
          from pathlib import Path
          from rich_charts import preprocess_chart_fences
          workdir = Path('/tmp/kordoc-chart')
          markdown = '''# 차트 테스트

          ```chart
          type: column
          title: 2024-2025 비교
          cat: 2024, 2025
          불용액: 100, 55
          ```
          '''
          rendered, count = preprocess_chart_fences(markdown, workdir)
          assert count == 1
          assert (workdir / 'chart_1.png').is_file()
          assert 'chart_1.png' in rendered
          (workdir / 'input.md').write_text(rendered, encoding='utf-8')
          PY
          cd /tmp/kordoc-chart
          kordoc generate input.md -o output.hwpx --preset 보고서
          test -s output.hwpx
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('/tmp/kordoc-chart/output.hwpx')
          with zipfile.ZipFile(p) as z:
              section = z.read('Contents/section0.xml')
              ET.fromstring(section)
              assert '차트 테스트' in section.decode('utf-8')
              image_names = [name for name in z.namelist() if name.lower().endswith(('.png', '.jpg', '.jpeg'))]
              assert len(image_names) >= 1
              hpf = z.read('Contents/content.hpf').decode('utf-8')
              assert any(name in hpf or Path(name).name in hpf for name in image_names)
          print(f'chart smoke OK: {p.stat().st_size} bytes, images={image_names}')
          PY

      - name: Complex report with multiple tables and charts
        run: |
          mkdir -p /tmp/kordoc-complex
          python - <<'PY'
          from pathlib import Path
          from rich_charts import preprocess_chart_fences
          workdir = Path('/tmp/kordoc-complex')
          paragraphs = '\n\n'.join(
              f'## 분석 {i}\n2025회계연도 사립학교 재정 분석 문단 {i}입니다. 집행 현황과 개선 방향을 검토합니다.'
              for i in range(1, 16)
          )
          markdown = f'''# 사립학교 재정 분석 보고서

          ## 주요 지표
          | 구분 | 2024 | 2025 | 증감 |
          |---|---:|---:|---:|
          | 집행률 | 94.79% | 95.53% | +0.74%p |
          | 이월률 | 4.36% | 3.10% | -1.26%p |
          | 불용률 | 0.85% | 1.37% | +0.52%p |

          ```chart
          type: column
          title: 연도별 집행률 비교
          cat: 2024, 2025
          집행률: 94.79, 95.53
          ```

          {paragraphs}

          ## 학교급별 현황
          | 학교급 | 예산 | 세출 | 비고 |
          |---|---:|---:|---|
          | 중학교 | 2396 | 2259 | 정상 |
          | 고등학교 | 5686 | 5449 | 정상 |
          | 특수학교 | 297 | 296 | 정상 |

          ```chart
          type: line
          title: 분기별 집행 추이
          cat: 1Q, 2Q, 3Q, 4Q
          집행률: 23.95, 43.96, 65.34, 95.53
          ```

          ## 결론
          이월률은 감소했고 최종 집행률은 상승했습니다. 불용률 증가는 개별 사업 원인을 추가 점검해야 합니다.
          '''
          rendered, count = preprocess_chart_fences(markdown, workdir)
          assert count == 2
          assert (workdir / 'chart_1.png').is_file()
          assert (workdir / 'chart_2.png').is_file()
          (workdir / 'input.md').write_text(rendered, encoding='utf-8')
          PY
          cd /tmp/kordoc-complex
          kordoc generate input.md -o output.hwpx --preset 보고서
          test -s output.hwpx
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('/tmp/kordoc-complex/output.hwpx')
          with zipfile.ZipFile(p) as z:
              section = z.read('Contents/section0.xml')
              ET.fromstring(section)
              text = section.decode('utf-8')
              for expected in (
                  '사립학교 재정 분석 보고서', '주요 지표', '집행률', '이월률', '불용률',
                  '분석 15', '학교급별 현황', '중학교', '고등학교', '특수학교', '결론'
              ):
                  assert expected in text, expected
              image_names = [name for name in z.namelist() if name.lower().endswith('.png')]
              assert len(image_names) >= 2, image_names
              hpf = z.read('Contents/content.hpf').decode('utf-8')
              assert sum(1 for name in image_names if name in hpf or Path(name).name in hpf) >= 2
          print(f'complex report smoke OK: {p.stat().st_size} bytes, images={image_names}')
          PY
