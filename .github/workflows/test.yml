name: tests

on:
  pull_request:
  push:
    branches:
      - agent/kordoc-default-engine

jobs:
  kordoc-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Kordoc
        run: |
          npm install -g kordoc@4.4.0 --omit=optional
          kordoc --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Compile migrated entrypoints
        run: python -m py_compile kordoc_engine.py rich_action_kordoc.py rich_action_ext.py rich_charts.py

      - name: Run Kordoc migration tests
        run: pytest -q tests/test_kordoc_engine.py tests/test_rich_charts.py

      - name: Real Kordoc HWPX smoke test
        run: |
          mkdir -p /tmp/kordoc-smoke
          printf '# 테스트\n\nKordoc 실제 HWPX 생성 확인용 문서입니다.\n' > /tmp/kordoc-smoke/input.md
          kordoc generate /tmp/kordoc-smoke/input.md -o /tmp/kordoc-smoke/output.hwpx --preset 보고서
          test -s /tmp/kordoc-smoke/output.hwpx
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('/tmp/kordoc-smoke/output.hwpx')
          assert p.stat().st_size > 0
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert 'Contents/section0.xml' in names
              assert 'Contents/content.hpf' in names
          print(f'real Kordoc smoke OK: {p.stat().st_size} bytes')
          PY

      - name: Real Kordoc table smoke test
        run: |
          mkdir -p /tmp/kordoc-table
          cat > /tmp/kordoc-table/input.md <<'MD'
          # 표 테스트

          | 학교급 | 학교수 | 집행률 |
          |---|---:|---:|
          | 중학교 | 49 | 94.0% |
          | 고등학교 | 68 | 94.9% |
          | 특수학교 | 4 | 99.6% |
          MD
          kordoc generate /tmp/kordoc-table/input.md -o /tmp/kordoc-table/output.hwpx --preset 보고서
          test -s /tmp/kordoc-table/output.hwpx
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('/tmp/kordoc-table/output.hwpx')
          with zipfile.ZipFile(p) as z:
              section = z.read('Contents/section0.xml')
              assert b'49' in section
              assert b'68' in section
          print(f'table smoke OK: {p.stat().st_size} bytes')
          PY

      - name: Real PNG chart embed smoke test
        run: |
          mkdir -p /tmp/kordoc-chart
          python - <<'PY'
          from pathlib import Path
          from rich_charts import preprocess_chart_fences

          workdir = Path('/tmp/kordoc-chart')
          markdown = '''# 차트 테스트

          ```chart
          type: column
          title: 2024-2025 비교
          cat: 2024, 2025
          불용액: 100, 55
          ```
          '''
          rendered, count = preprocess_chart_fences(markdown, workdir)
          assert count == 1
          assert (workdir / 'chart_1.png').is_file()
          (workdir / 'input.md').write_text(rendered, encoding='utf-8')
          PY
          kordoc generate /tmp/kordoc-chart/input.md -o /tmp/kordoc-chart/output.hwpx --preset 보고서 --image-dir /tmp/kordoc-chart
          test -s /tmp/kordoc-chart/output.hwpx
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('/tmp/kordoc-chart/output.hwpx')
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              image_names = [name for name in names if name.lower().endswith(('.png', '.jpg', '.jpeg'))]
              assert image_names, names
          print(f'chart smoke OK: {p.stat().st_size} bytes')
          PY
