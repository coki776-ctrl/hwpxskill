name: tests

on:
  pull_request:
  push:
    branches:
      - agent/kordoc-default-engine

jobs:
  kordoc-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Kordoc
        run: |
          npm install -g kordoc@4.4.0 --omit=optional
          kordoc --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Compile migrated entrypoints
        run: python -m py_compile kordoc_engine.py rich_action_kordoc.py rich_action_ext.py rich_charts.py

      - name: Run Kordoc migration tests
        run: pytest -q tests/test_kordoc_engine.py tests/test_rich_charts.py
